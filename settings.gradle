/*
 * Settings for the MCAgents core multi project build.
 *
 * The root project is named `core`, which is what gives the published
 * modules their `mcagents-core-{module}` artifact ids — see the
 * `artifactId` rule in the root `build.gradle`.
 */

pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Apply the foojay-resolver plugin to allow automatic download of JDKs
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'core'

// Pure Java layers. Everything else compiles against these two and never the
// other way around.
include 'api'
include 'common'

// The loader-agnostic mod code: both physical sides, and what decides which
// one is running. Plain Java, compiled without any loader toolchain.
include 'platforms:shared'

// The Minecraft version core builds for: only ever the latest release, never an
// older one beside it. Each module below compiles against Minecraft, so it is a
// folder of shared sources, platforms/{module}/src, with a subproject for the
// version in platforms/{module}/{version}, holding only what is particular to
// that version. The subproject is named for its module alone, as in
// :platforms:fabric, so no project path or artifact id carries the version; only
// the folder and the jar name do. The catalog carries the version's block of
// coordinates. Moving to a new Minecraft release replaces the version here, the
// catalog block and each module's version folder; nothing else names it.
def minecraftVersion = '26.3'

// What core draws in the game and the input that drives it, on the client only.
// Compiled against vanilla Minecraft, never a loader.
//
// Then one module per mod loader. Each brings its own toolchain and builds its
// own jar carrying api, common, shared and client — a loader never loads another
// loader's classes, so the jars are never merged.
['client', 'forge', 'neoforge', 'fabric'].each { module ->
    include "platforms:${module}"
    project(":platforms:${module}").projectDir = file("platforms/${module}/${minecraftVersion}")
}
