/*
 * Settings for the MCAgents core multi project build.
 *
 * The root project is named `core`, which is what gives the published
 * modules their `mcagents-core-{module}` artifact ids — see the
 * `artifactId` rule in the root `build.gradle`.
 */

pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Apply the foojay-resolver plugin to allow automatic download of JDKs
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'core'

// Pure Java layers. Everything else compiles against these two and never the
// other way around.
include 'api'
include 'common'

// The loader-agnostic mod code: both physical sides, and what decides which
// one is running. Plain Java, compiled without any loader toolchain.
include 'platforms:shared'

// Every Minecraft version core builds for. Each module below compiles against
// Minecraft, so it is a folder of shared sources, platforms/{module}/src, with
// one subproject per version in platforms/{module}/{version}, holding only what
// differs for that version. The subproject is named {module}-{version}, as in
// :platforms:fabric-26.2: two projects of one name would be one module to
// Gradle. The catalog carries one block of coordinates per version.
def minecraftVersions = ['26.2']

// What core draws in the game and the input that drives it, on the client only.
// Compiled against vanilla Minecraft, never a loader.
//
// Then one module per mod loader. Each brings its own toolchain and builds its
// own jar carrying api, common, shared and client — a loader never loads another
// loader's classes, so the jars are never merged.
['client', 'forge', 'neoforge', 'fabric'].each { module ->
    minecraftVersions.each { minecraft ->
        include "platforms:${module}-${minecraft}"
        project(":platforms:${module}-${minecraft}").projectDir = file("platforms/${module}/${minecraft}")
    }
}
