/*
 * Settings for the MCAgents core multi project build.
 *
 * The root project is named `mcagents`, which is what gives the published
 * modules their `mcagents-api` and `mcagents-common` artifact ids — see the
 * `artifactId` rule in the root `build.gradle`.
 */

plugins {
    // Apply the foojay-resolver plugin to allow automatic download of JDKs
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'mcagents'

// Pure Java layers. Everything else compiles against these two and never the
// other way around.
include 'api'
include 'common'

// Mod loader family, all under `platforms/mods`. `platforms:mods:core` holds
// what every mod module shares; `client`
// and `server` hold the two physical sides, which the loaders never mix; the
// loader entry points add only what NeoForge or Fabric itself needs.
include 'platforms:mods:core'
include 'platforms:mods:client'
include 'platforms:mods:server'
include 'platforms:mods:neoforge'
include 'platforms:mods:fabric'

