/*
 * Settings for the MCAgents core multi project build.
 *
 * The root project is named `core`, which is what gives the published
 * modules their `core-{module}` artifact ids — see the `artifactId` rule in
 * the root `build.gradle`.
 */

pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // Apply the foojay-resolver plugin to allow automatic download of JDKs
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'core'

// Pure Java layers. Everything else compiles against these three and never the
// other way around. tool needs nothing but the JDK; api builds on it.
include 'tool'
include 'api'
include 'common'

// The loader-agnostic mod code: both physical sides, and what decides which
// one is running. Plain Java, compiled without any loader toolchain.
include 'platforms:shared'

// What core draws in the game and the input that drives it, on the client only;
// and the commands core adds to a dedicated server, on the server only. Both are
// compiled against vanilla Minecraft, never a loader.
//
// Then one module per mod loader. Each brings its own toolchain and builds its
// own jar carrying tool, api, common, shared, client and server — a loader never loads another
// loader's classes, so the jars are never merged.
//
// Each is one folder, platforms/{module}, with its build.gradle and src/. They
// build for the latest Minecraft release alone, which the catalog names.
include 'platforms:client'
include 'platforms:server'
include 'platforms:forge'
include 'platforms:neoforge'
include 'platforms:fabric'
