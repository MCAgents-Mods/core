# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format
#
# Every coordinate the build compiles against lives here, so a version bump is
# a one line change in a single file rather than a sweep across the modules.

[versions]
# The loader toolchains, independent of the Minecraft version.
fabric-loader = "0.19.5"
fabric-loom = "1.18.4"
moddevgradle = "2.0.148"
forgegradle = "7.0.40"
# The block for the one Minecraft version core supports, the latest release,
# each entry suffixed with the version (26.3 -> -26-3). Every Minecraft-facing
# module has a subproject for it, platforms/{module}/{version}, which finds its
# entries by that suffix; the version itself is listed in settings.gradle.
# Moving to a new release replaces this block, that entry and each module's
# version folder; the old version is not kept. Check each loader's own maven
# first: Fabric (meta.fabricmc.net), NeoForge (maven.neoforged.net) and Forge
# (maven.minecraftforge.net) must all publish a build for it. Minecraft 26.x
# ships unobfuscated, so no module declares a mappings coordinate. The Forge
# pack.mcmeta in platforms/forge/{version} moves with it: copy its formats from
# that Forge build's own pack.mcmeta.
minecraft-26-3 = "26.3"
fabric-api-26-3 = "0.162.0+26.3"
neoforge-26-3 = "26.3.0.76"
forge-26-3 = "26.3-66.0.11"
# JSON codec used to read and write the vendor wire formats. Provided by
# Minecraft at runtime, so it is only ever a compileOnly dependency.
gson = "2.14.0"
# The test framework, applied to every module from the root build. Declared
# once as a BOM so the jupiter and platform artifacts can never drift apart.
junit = "6.1.3"

[libraries]
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
minecraft-26-3 = { module = "com.mojang:minecraft", version.ref = "minecraft-26-3" }
fabric-api-26-3 = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api-26-3" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# Versionless on purpose: the BOM above pins both, so there is exactly one
# number to change when the test framework moves.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
moddevgradle = { id = "net.neoforged.moddev", version.ref = "moddevgradle" }
forgegradle = { id = "net.minecraftforge.gradle", version.ref = "forgegradle" }
