# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format
#
# Every coordinate the build compiles against lives here, so a version bump is
# a one line change in a single file rather than a sweep across the modules.

[versions]
# The one Minecraft version every loader module builds against. Check each
# loader's own maven before moving it: Fabric (meta.fabricmc.net), NeoForge
# (maven.neoforged.net) and Forge (maven.minecraftforge.net) must all publish a
# build for it. Minecraft 26.x ships unobfuscated, so no module declares a
# mappings coordinate. The pack formats in the Forge module's pack.mcmeta move
# with it: copy them from that Forge build's own pack.mcmeta.
minecraft = "26.2"
fabric-loader = "0.19.3"
fabric-api = "0.157.0+26.2"
fabric-loom = "1.17.19"
neoforge = "26.2.0.90"
moddevgradle = "2.0.148"
forge = "26.2-65.1.3"
forgegradle = "7.0.40"
# JSON codec used to read and write the vendor wire formats. Provided by
# Minecraft at runtime, so it is only ever a compileOnly dependency.
gson = "2.14.0"
# The test framework, applied to every module from the root build. Declared
# once as a BOM so the jupiter and platform artifacts can never drift apart.
junit = "6.1.3"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# Versionless on purpose: the BOM above pins both, so there is exactly one
# number to change when the test framework moves.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
moddevgradle = { id = "net.neoforged.moddev", version.ref = "moddevgradle" }
forgegradle = { id = "net.minecraftforge.gradle", version.ref = "forgegradle" }
