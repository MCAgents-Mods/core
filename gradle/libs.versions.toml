# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format
#
# Every coordinate the build compiles against lives here, so a version bump is
# a one line change in a single file rather than a sweep across the modules.

[versions]
# JSON codec used to read and write the vendor wire formats. Provided by
# Minecraft at runtime, so it is only ever a compileOnly dependency.
gson = "2.14.0"
# The test framework, applied to every module from the root build. Declared
# once as a BOM so the jupiter and platform artifacts can never drift apart.
junit = "6.1.3"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# Versionless on purpose: the BOM above pins both, so there is exactly one
# number to change when the test framework moves.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
