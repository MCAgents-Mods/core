plugins {
    // The three loader toolchains are declared once, here, so they load into
    // one shared build classloader instead of one per module.
    alias(libs.plugins.fabric.loom) apply false
    alias(libs.plugins.moddevgradle) apply false
    alias(libs.plugins.forgegradle) apply false
}

allprojects {
    group = project.property('project-group')
    version = "${project.property('project-version')}"

    repositories {
        mavenCentral()
    }
}

subprojects {
    // Skip projects that don't have their own build.gradle file (e.g., the 'platforms' intermediate folder)
    if (!file('build.gradle').exists()) {
        return
    }

    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    // Tests are JUnit 5 everywhere, wired once here rather than repeated in
    // each module's own build file. A module with no `src/test/java` costs
    // nothing: Gradle reports its test task as NO-SOURCE and moves on.
    //
    // A module that compiles against `api`, `common`, or its family core
    // declares those `compileOnly`, which deliberately does not reach the test
    // compile classpath. Such a module adds its own `testImplementation
    // project(...)` lines — see `common/build.gradle`.
    dependencies {
        testImplementation platform(libs.junit.bom)
        testImplementation libs.junit.jupiter
        testRuntimeOnly libs.junit.platform.launcher
    }

    tasks.named('test') {
        useJUnitPlatform()
        testLogging {
            events 'failed'
            exceptionFormat 'full'
        }
    }

    apply plugin: 'maven-publish'

    publishing {
        repositories {
            maven {
                name = "GitHubPackages"
                url = "https://maven.pkg.github.com/${project.property('git-org-name')}/${project.property('git-repository')}"
                credentials {
                    username = System.getenv("GITHUB_ACTOR")
                    password = System.getenv("GITHUB_TOKEN")
                }
            }
        }

        publications.withType(MavenPublication) {
            // Qualify the coordinates with the family and the root project
            // name. Without this the artifactId defaults to the bare module
            // name, so every project in this group would publish a colliding
            // io.github.mcagentsmods:api — a consumer could not depend on core
            // and another mod at the same time. Gives mcagents-core-api,
            // mcagents-core-common, mcagents-core-shared, mcagents-core-fabric,
            // mcagents-core-forge and mcagents-core-neoforge; the jar names are
            // the archivesName each module sets, MCAgentsCore{Module}.
            artifactId = "mcagents-${rootProject.name}-${project.name}"

            pom {
                url = "https://github.com/${project.property('git-org-name')}/${project.property('git-repository')}"
                developers {
                    developer {
                        id = "jetsadawijit"
                        name = "jetsadawijit"
                        url = "https://jetsadawijit.github.io"
                    }
                }
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
