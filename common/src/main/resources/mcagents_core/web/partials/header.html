<!-- Shared chrome, served by core. {{TOKEN}} is substituted by /assets/core/js/site.js, and the
     links are built there from /api/core/navigation: one group per mod that registered pages. -->
<header class="site-header">
  <nav class="nav" aria-label="Console">
    <a class="nav__brand" href="/core/?t={{TOKEN}}">
      <span class="nav__mark" aria-hidden="true">MC</span>
      <span>MCAgents Console</span>
    </a>

    <button class="nav__toggle" type="button" aria-expanded="false" aria-label="Menu">
      <span aria-hidden="true">&#9776;</span>
    </button>

    <div class="nav__links">
      <span class="nav__spacer"></span>
      <span class="nav__status" title="Served from your own machine">
        <span class="nav__dot" aria-hidden="true"></span>
        <span>127.0.0.1</span>
      </span>
    </div>
  </nav>
</header>
