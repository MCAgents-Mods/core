<!DOCTYPE html>
<!--
  The console's front page, served by core at /core/. Lists every mod that registered pages;
  it holds no data of its own, and fetches the list from /api/core/navigation.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>MCAgents Console</title>
  <link rel="stylesheet" href="/assets/core/css/main.css">
  <link rel="stylesheet" href="/assets/core/css/layout.css">
  <link rel="stylesheet" href="/assets/core/css/components.css">
</head>
<body data-module="core" data-section="">
<div id="site-header"></div>

<main>
  <div class="container narrow">
    <section class="hero">
      <p class="eyebrow">Local console</p>
      <h1>MCAgents</h1>
      <p class="lead">Every MCAgents mod you have installed that has pages puts them here.</p>
    </section>

    <section class="panel">
      <h2>Your mods</h2>
      <div id="modules"></div>
    </section>
  </div>
</main>

<div id="site-footer"></div>
<script src="/assets/core/js/site.js"></script>
<script src="/assets/core/js/index.js"></script>
</body>
</html>
