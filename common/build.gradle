plugins {
    id 'java-library'

    // StubTransport and StubKeySource are the doubles this module's tests drive
    // the model client with, and a consuming mod tests its own code against
    // them too. A test source set is private to its project, so they live in
    // src/testFixtures, which this project's own tests still see.
    id 'java-test-fixtures'
}

dependencies {
    // The contracts this module implements. Declared compileOnly so the api
    // classes are never duplicated into a consumer's classpath by this jar —
    // the mod jar that ships them bundles exactly one copy.
    compileOnly project(':api')

    // JSON codec for the vendor wire formats. compileOnly because Minecraft
    // itself puts Gson on the classpath for every mod loader. Shading a second
    // copy would be waste.
    compileOnly libs.gson
}

dependencies {
    // `compileOnly` does not reach the test compile classpath, so the contracts
    // this module implements are declared again for the tests. The mod jar still
    // bundles exactly one copy; nothing here changes what ships.
    testImplementation project(':api')
    testImplementation libs.gson

    // The fixtures implement api contracts, so a consumer of the fixtures needs
    // the api on its test classpath as well.
    testFixturesApi project(':api')
}

base {
    archivesName = 'MCAgentsCoreCommon'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'MCAgentsCoreCommon'
                description = "MCAgents Core Common"
            }
        }
    }
}

// The test-fixtures variants carry the capability {group}:{project name}-test-fixtures,
// which is common-test-fixtures here, not the published artifact id. A consumer that writes
// testFixtures('io.github.mcagentsmods:mcagents-core-common') asks for
// mcagents-core-common-test-fixtures, so the variants declare that capability too. The
// old one stays, so a consumer that asked for it against 0.5.0 keeps resolving.
['testFixturesApiElements', 'testFixturesRuntimeElements'].each { name ->
    configurations.named(name) {
        outgoing.capability("${project.group}:mcagents-${rootProject.name}-${project.name}-test-fixtures:${project.version}")
    }
}
