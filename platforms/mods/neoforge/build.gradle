plugins {
    id 'java-library'
}

dependencies {
    // The shared layers are bundled once, by the mod jar that ships them.
    // Every module below it declares them compileOnly so no jar carries a
    // second copy.
    compileOnly project(':api')
    compileOnly project(':common')

    // The mod family core, which holds what every loader shares. This module
    // adds only what NeoForge itself needs.
    compileOnly project(':platforms:mods:core')

    compileOnly libs.gson
}

// The NeoForge coordinate is not declared yet. Resolving net.neoforged:neoforge
// requires the ModDevGradle toolchain, which remaps Minecraft as part of the
// build. It is introduced together with the first real NeoForge entry point
// rather than being scaffolded ahead of the code that needs it.

base {
    archivesName = "${rootProject.name}-neoforge"
}
