// The Fabric mod jar: core's tool, api, common, shared and client code, plus the two Fabric
// entry points. The only module that may reference Fabric types.

plugins {
    id 'net.fabricmc.fabric-loom'
}

// The one Minecraft version core supports, the latest release, as the catalog names it.
def minecraftVersion = libs.versions.minecraft.get()

def clientModule = ':platforms:client'

loom {
    mods {
        'mcagents_core' {
            sourceSet sourceSets.main
            // The dev client loads the client module as part of this mod, as the jar
            // merges it, so it finds the module's strings. Only a Loom module can be
            // named here; api, common and shared carry no assets.
            sourceSet 'main', clientModule
        }
    }
}

dependencies {
    minecraft libs.minecraft

    // Core's own modules are part of this mod: the jar task below merges their classes, and
    // the dev client runs them from this module's class path. This module is never published,
    // so implementation reaches nothing else.
    implementation project(':tool')
    implementation project(':api')
    implementation project(':common')
    implementation project(':platforms:shared')
    implementation project(clientModule)

    // Only compiled against: the game provides Fabric Loader and Fabric API at runtime.
    compileOnly libs.fabric.loader
    compileOnly libs.fabric.api

    // The dev client (runClient) is the one place no game provides them, so it gets them here.
    runtimeOnly libs.fabric.loader
    runtimeOnly libs.fabric.api
}

// tool, api, common, shared and client are core's own modules, so their classes are
// merged into the mod jar rather than nested as separate Fabric mods. Every
// other loader jar does the same, which is what makes each one self-contained.
def bundledModules = [':tool', ':api', ':common', ':platforms:shared', clientModule]

tasks.named('jar', Jar) {
    // {Name}-0.13.2+26.3.jar: the mod's version, then the game's.
    archiveVersion = "${project.version}+${minecraftVersion}"
    bundledModules.each { path ->
        from project(path).sourceSets.main.output
    }
    from(rootProject.file('LICENSE')) {
        rename { "${it}_mcagents_core" }
    }
}

processResources {
    // The jar declares its own Minecraft version and the loader it was built with.
    def properties = [version: project.version, minecraft: minecraftVersion,
                      fabricLoader: libs.versions.fabric.loader.get()]
    inputs.properties properties

    filesMatching('fabric.mod.json') {
        expand properties
    }
}

base {
    archivesName = 'MCAgentsCoreFabric'
}

// The mod jar is never published to GitHub Packages: the Release workflow attaches it to the
// GitHub release of each version, and only the library modules are published.
