// The Fabric mod jar: core's api, common, shared and client code, plus the two Fabric
// entry points. The only module that may reference Fabric types.
//
// Applied by each Minecraft version subproject, platforms/fabric/{version}, after it
// applies Loom; that subproject builds the jar for its version.

apply from: '../../minecraft.gradle'

def clientModule = ":platforms:client-${minecraftVersion}"

loom {
    mods {
        'mcagents_core' {
            sourceSet sourceSets.main
            // The dev client loads the client module as part of this mod, as the jar
            // merges it, so it finds the module's strings. Only a Loom module can be
            // named here; api, common and shared carry no assets.
            sourceSet 'main', clientModule
        }
    }
}

dependencies {
    minecraft libraryFor('minecraft')
    implementation libs.fabric.loader
    implementation libraryFor('fabric-api')

    implementation project(':api')
    implementation project(':common')
    implementation project(':platforms:shared')
    implementation project(clientModule)
}

// api, common, shared and client are core's own modules, so their classes are
// merged into the mod jar rather than nested as separate Fabric mods. Every
// other loader jar does the same, which is what makes each one self-contained.
def bundledModules = [':api', ':common', ':platforms:shared', clientModule]

tasks.named('jar', Jar) {
    bundledModules.each { path ->
        from project(path).sourceSets.main.output
    }
    from(rootProject.file('LICENSE')) {
        rename { "${it}_mcagents_core" }
    }
}

processResources {
    // The jar declares its own Minecraft version and the loader it was built with.
    def properties = [version: project.version, minecraft: minecraftVersion,
                      fabricLoader: libs.versions.fabric.loader.get()]
    inputs.properties properties

    filesMatching('fabric.mod.json') {
        expand properties
    }
}

base {
    archivesName = 'MCAgentsCoreFabric'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            // The mod jar alone, with no dependency list: it already carries
            // api, common, shared and client, and the loader supplies the rest.
            artifact jar

            pom {
                name = 'MCAgentsCoreFabric'
                description = "MCAgents Core for Fabric, Minecraft ${minecraftVersion}"
            }
        }
    }
}
