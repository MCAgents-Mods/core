// The Forge mod jar: core's tool, api, common, shared, client and server code, plus the Forge entry
// point. The only module that may reference Forge types.
//
// src/main/resources/pack.mcmeta carries the resource formats of the Minecraft version this
// module builds for, and moves with it.

plugins {
    id 'net.minecraftforge.gradle'
}

// The one Minecraft version core supports, the latest release, as the catalog names it.
def minecraftVersion = libs.versions.minecraft.get()

// The first Minecraft version this one does not cover, for the closed range the loader
// metadata declares: 26.3 -> 26.4.
def minecraftNext = minecraftVersion.tokenize('.').with { parts ->
    "${parts[0]}.${(parts[1] as int) + 1}"
}

def clientModule = ':platforms:client'
def serverModule = ':platforms:server'
def forgeVersion = libs.versions.forge.get()

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

dependencies {
    def forge = minecraft.dependency("net.minecraftforge:forge:${forgeVersion}")

    // Core's own modules are part of this mod: the jar task below merges their classes, and
    // the dev client runs them from this module's class path. This module is never published,
    // so implementation reaches nothing else.
    implementation project(':tool')
    implementation project(':api')
    implementation project(':common')
    implementation project(':platforms:shared')
    implementation project(clientModule)
    implementation project(serverModule)

    // Only compiled against: the game provides Forge at runtime.
    compileOnly forge

    // The dev client (runClient) is the one place no game provides it, so it gets it here.
    runtimeOnly forge
}

// tool, api, common, shared, client and server are core's own modules, so their classes are
// merged into the mod jar. Every loader jar does the same, which is what makes
// each one self-contained.
def bundledModules = [':tool', ':api', ':common', ':platforms:shared', clientModule, serverModule]

bundledModules.each { path -> evaluationDependsOn(path) }

// Forge's dev client takes the directory holding mods.toml as the whole mod, so
// it gets one directory holding what the jar holds.
def devMod = tasks.register('devModDirectory', Sync) {
    into layout.buildDirectory.dir('devMod')
    from sourceSets.main.output
    bundledModules.each { path -> from project(path).sourceSets.main.output }
}

minecraft {
    runs {
        // A development client: ./gradlew :platforms:forge:runClient, in run/.
        client {
            workingDir = project.file('run')
            // The jar names its mixins in its manifest; a run from a directory has no
            // manifest, so it names them here.
            args '--mixin.config', 'mcagents_core.mixins.json'
        }
    }
}

// ForgeGradle fills in the run's class path itself, so the separate pieces are
// swapped for the one directory just before the game starts.
tasks.withType(JavaExec).matching { it.name == 'runClient' }.configureEach {
    dependsOn devMod
    def merged = files(devMod)
    def separate = files(sourceSets.main.output)
    // Captured here rather than called from the action, which the configuration
    // cache would refuse.
    def fileCollections = objects
    doFirst {
        def rest = classpath.files.findAll { file ->
            !separate.contains(file) && !file.name.startsWith('MCAgentsCore')
        }
        classpath = merged + fileCollections.fileCollection().from(rest)
    }
}

tasks.named('jar', Jar) {
    // {Name}-0.13.2+26.3.jar: the mod's version, then the game's.
    archiveVersion = "${project.version}+${minecraftVersion}"
    // Forge has no event for drawing in the level, so a mixin draws the holograms.
    manifest {
        attributes('MixinConfigs': 'mcagents_core.mixins.json')
    }
    bundledModules.each { path ->
        from project(path).sourceSets.main.output
    }
    from(rootProject.file('LICENSE')) {
        rename { "${it}_mcagents_core" }
    }
}

processResources {
    // The jar declares its own Minecraft version, and the Forge major it was built
    // against: 66 from 26.3-66.0.11.
    def properties = [version: project.version, minecraft: minecraftVersion,
                      minecraftNext: minecraftNext,
                      forgeMajor: forgeVersion.tokenize('-')[1].tokenize('.')[0]]
    inputs.properties properties

    filesMatching('META-INF/mods.toml') {
        expand properties
    }
}

base {
    archivesName = 'MCAgentsCoreForge'
}

// The mod jar is never published to GitHub Packages: the Release workflow attaches it to the
// GitHub release of each version, and only the library modules are published.
