// The NeoForge mod jar: core's api, common, shared and client code, plus the NeoForge
// entry point. The only module that may reference NeoForge types.
//
// Applied by each Minecraft version subproject, platforms/neoforge/{version}, after it
// applies ModDevGradle; that subproject builds the jar for its version.

apply from: '../../minecraft.gradle'

def clientModule = ':platforms:client'

// api, common, shared and client are core's own modules, so their classes are
// merged into the mod jar. Every loader jar does the same, which is what makes
// each one self-contained.
def bundledModules = [':api', ':common', ':platforms:shared', clientModule]

// The dev client loads the bundled modules as part of this mod, as the jar
// does; loaded apart, NeoForge would give them a class loader of their own.
bundledModules.each { path -> evaluationDependsOn(path) }

neoForge {
    version = versionFor('neoforge')

    // A development client: ./gradlew :platforms:neoforge:runClient, in run/.
    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
    }

    mods {
        'mcagents_core' {
            sourceSet sourceSets.main
            bundledModules.each { path -> sourceSet project(path).sourceSets.main }
        }
    }
}

dependencies {
    implementation project(':api')
    implementation project(':common')
    implementation project(':platforms:shared')
    implementation project(clientModule)
}

tasks.named('jar', Jar) {
    bundledModules.each { path ->
        from project(path).sourceSets.main.output
    }
    from(rootProject.file('LICENSE')) {
        rename { "${it}_mcagents_core" }
    }
}

processResources {
    // The jar declares its own Minecraft version, and NeoForge for it.
    def properties = [version: project.version, minecraft: minecraftVersion,
                      minecraftNext: minecraftNext]
    inputs.properties properties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand properties
    }
}

base {
    archivesName = 'MCAgentsCoreNeoforge'
}

// The mod jar is never published to GitHub Packages: the Release workflow attaches it to the
// GitHub release of each version, and only the library modules are published.
