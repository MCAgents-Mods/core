modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/MCAgents-Mods/core/issues"

[[mods]]
modId = "mcagents_core"
version = "${version}"
displayName = "MCAgents Core"
authors = "MCAgents"
description = '''
The shared foundation MCAgents mods build on: the language model client and the in-game holograms other mods open.
'''

[[dependencies.mcagents_core]]
modId = "neoforge"
type = "required"
versionRange = "[${minecraft},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.mcagents_core]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft},${minecraftNext})"
ordering = "NONE"
side = "BOTH"

# MCAgents chat before 0.4.0 opens the web console, which core 0.6.0 removed.
[[dependencies.mcagents_core]]
modId = "mcagents"
type = "incompatible"
reason = "MCAgents chat before 0.4.0 needs the web console, which MCAgents Core 0.6.0 removed. Update MCAgents chat."
versionRange = "(,0.4.0)"
ordering = "NONE"
side = "BOTH"
